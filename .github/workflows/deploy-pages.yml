name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: files/aura-luxe-fixed/package-lock.json

      - name: Install dependencies
        working-directory: files/aura-luxe-fixed
        run: npm ci

      - name: Build website
        working-directory: files/aura-luxe-fixed
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: files/aura-luxe-fixed/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
